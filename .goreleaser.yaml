# Release packaging for the operator CLI, aws-elastic-gcs-ctl.
# Runs from .github/workflows/release.yml on every v* tag. The infrastructure
# itself (CDK app, Lambdas, scripts) is deployed from a clone, not packaged.
version: 2

project_name: aws-elastic-gcs

before:
  hooks:
    - go mod download

builds:
  - id: ctl
    main: ./cmd/aws-elastic-gcs-ctl
    binary: aws-elastic-gcs-ctl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.toolVersion={{ .Tag }}

archives:
  - id: ctl
    ids: [ctl]
    formats: [tar.gz]
    name_template: >-
      aws-elastic-gcs-ctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes come from CHANGELOG.md (--release-notes in the workflow).
changelog:
  disable: true

release:
  github:
    owner: scttfrdmn
    name: aws-elastic-gcs
  prerelease: auto
  mode: keep-existing
  # Re-publishing a tag (workflow_dispatch) overwrites same-named assets.
  replace_existing_artifacts: true
  footer: |
    ### Install the operator CLI
    ```bash
    brew tap scttfrdmn/tap && brew trust scttfrdmn/tap     # Homebrew 7+ loads only trusted third-party taps
    brew install --cask aws-elastic-gcs-ctl                 # macOS / Linux
    scoop bucket add scttfrdmn https://github.com/scttfrdmn/scoop-bucket
    scoop install aws-elastic-gcs-ctl                      # Windows
    ```
    `.deb` and `.rpm` packages and plain archives are attached below; verify them
    with `checksums.txt`. The infrastructure is deployed from a clone of this
    repository (see the README).

    **Full changelog:** https://github.com/scttfrdmn/aws-elastic-gcs/compare/{{ .PreviousTag }}...{{ .Tag }}

nfpms:
  - id: packages
    ids: [ctl]
    package_name: aws-elastic-gcs-ctl
    file_name_template: >-
      aws-elastic-gcs-ctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [deb, rpm]
    vendor: Scott Friedman
    maintainer: Scott Friedman <scttfrdmn@users.noreply.github.com>
    homepage: https://scttfrdmn.github.io/aws-elastic-gcs/
    description: Operator CLI for Elastic Globus Connect Server deployments on AWS
    license: Apache-2.0
    section: admin
    bindir: /usr/bin

# Homebrew cask in scttfrdmn/homebrew-tap (Casks/, macOS and Linux) and Scoop
# manifest in scttfrdmn/scoop-bucket. Casks replace goreleaser's deprecated
# binary-installing formulas (brews, deprecated since v2.10/v2.16); inkcap
# publishes to the same tap this way. Repo secrets HOMEBREW_TAP_GITHUB_TOKEN and
# SCOOP_BUCKET_GITHUB_TOKEN; a missing token fails the release.
homebrew_casks:
  - name: aws-elastic-gcs-ctl
    ids: [ctl]
    binaries: [aws-elastic-gcs-ctl]
    repository:
      owner: scttfrdmn
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://scttfrdmn.github.io/aws-elastic-gcs/
    description: Operator CLI for Elastic Globus Connect Server deployments on AWS
    license: Apache-2.0
    skip_upload: auto
    hooks:
      post:
        # The binary isn't notarized: clear the quarantine flag so macOS runs it.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/aws-elastic-gcs-ctl"]
          end

scoops:
  - name: aws-elastic-gcs-ctl
    ids: [ctl]
    repository:
      owner: scttfrdmn
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://scttfrdmn.github.io/aws-elastic-gcs/
    description: Operator CLI for Elastic Globus Connect Server deployments on AWS
    license: Apache-2.0
    skip_upload: auto
