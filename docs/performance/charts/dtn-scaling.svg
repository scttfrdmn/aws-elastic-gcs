<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">One task scales to ~4 DTNs; more need more tasks</title><desc id="d">Line chart. Steady state: 9.2, 18.1, 37.2 Gbps at 1, 2, 4 DTNs. Wall clock: 6.3, 11.5, 17.4, 13.0 at 1, 2, 4, 8. Two concurrent tasks at 8 DTNs: 25.0 Gbps aggregate.</desc><style>
  .surface { fill: #fcfcfb; } .ink1 { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; } .axis { stroke: #c3c2b7; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
  .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; }
  .ring { stroke: #fcfcfb; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; } .ink1 { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .ring { stroke: #1a1a19; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .t-title { font-size: 16px; font-weight: 600; } .t-sub { font-size: 12px; }
  .t-tick { font-size: 11px; font-variant-numeric: tabular-nums; } .t-label { font-size: 12px; }
  .t-value { font-size: 12px; font-weight: 600; }
</style>
<rect class="surface" x="0" y="0" width="760" height="400" rx="8"/>
<text x="24.0" y="30.0" class="t-title ink1" text-anchor="start">One task scales to ~4 DTNs; more need more tasks</text>
<text x="24.0" y="50.0" class="t-sub ink2" text-anchor="start">Single task src -&gt; dst on N c8in.2xlarge DTNs per side, Gbps. Endpoint concurrency is capped</text>
<text x="24.0" y="66.0" class="t-sub ink2" text-anchor="start">at 128 processes per task, so past ~4 DTNs each node gets too few processes.</text>
<line x1="64.0" y1="316.0" x2="610.0" y2="316.0" class="grid" stroke-width="1"/>
<text x="56.0" y="320.0" class="t-tick muted" text-anchor="end">0</text>
<line x1="64.0" y1="261.0" x2="610.0" y2="261.0" class="grid" stroke-width="1"/>
<text x="56.0" y="265.0" class="t-tick muted" text-anchor="end">10</text>
<line x1="64.0" y1="206.0" x2="610.0" y2="206.0" class="grid" stroke-width="1"/>
<text x="56.0" y="210.0" class="t-tick muted" text-anchor="end">20</text>
<line x1="64.0" y1="151.0" x2="610.0" y2="151.0" class="grid" stroke-width="1"/>
<text x="56.0" y="155.0" class="t-tick muted" text-anchor="end">30</text>
<line x1="64.0" y1="96.0" x2="610.0" y2="96.0" class="grid" stroke-width="1"/>
<text x="56.0" y="100.0" class="t-tick muted" text-anchor="end">40</text>
<line x1="64.0" y1="316.0" x2="610.0" y2="316.0" class="axis" stroke-width="1"/>
<text x="64.0" y="334.0" class="t-tick muted" text-anchor="middle">1</text>
<text x="142.0" y="334.0" class="t-tick muted" text-anchor="middle">2</text>
<text x="298.0" y="334.0" class="t-tick muted" text-anchor="middle">4</text>
<text x="610.0" y="334.0" class="t-tick muted" text-anchor="middle">8</text>
<text x="337.0" y="354.0" class="t-tick muted" text-anchor="middle">DTNs per side</text>
<polyline points="64.0,265.4 142.0,216.4 298.0,111.4" fill="none" class="l1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="64.0,281.3 142.0,252.5 298.0,220.2 610.0,244.6" fill="none" class="l2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="64.0" cy="265.4" r="5" class="s1 ring" stroke-width="2"><title>1 DTNs: 9.2 Gbps steady state</title></circle>
<circle cx="142.0" cy="216.4" r="5" class="s1 ring" stroke-width="2"><title>2 DTNs: 18.1 Gbps steady state</title></circle>
<circle cx="298.0" cy="111.4" r="5" class="s1 ring" stroke-width="2"><title>4 DTNs: 37.2 Gbps steady state</title></circle>
<circle cx="64.0" cy="281.3" r="5" class="s2 ring" stroke-width="2"><title>1 DTNs: 6.3 Gbps wall clock (198 GB)</title></circle>
<circle cx="142.0" cy="252.5" r="5" class="s2 ring" stroke-width="2"><title>2 DTNs: 11.5 Gbps wall clock (373 GB)</title></circle>
<circle cx="298.0" cy="220.2" r="5" class="s2 ring" stroke-width="2"><title>4 DTNs: 17.4 Gbps wall clock (659 GB)</title></circle>
<circle cx="610.0" cy="244.6" r="5" class="s2 ring" stroke-width="2"><title>8 DTNs: 13.0 Gbps wall clock (1244 GB)</title></circle>
<circle cx="610.0" cy="178.5" r="5" class="s3 ring" stroke-width="2"><title>8 DTNs, 2 concurrent tasks: 25.0 Gbps aggregate wall clock</title></circle>
<text x="308.0" y="115.4" class="t-value ink1" text-anchor="start">37 steady</text>
<text x="620.0" y="182.5" class="t-value ink1" text-anchor="start">25 with 2 tasks</text>
<text x="620.0" y="248.6" class="t-value ink1" text-anchor="start">13 wall, 1 task</text>
<rect x="64" y="377" width="10" height="10" rx="2" class="s1"/>
<text x="80.0" y="386.0" class="t-label ink2" text-anchor="start">Steady state (sum of DTN NICs)</text>
<rect x="298" y="377" width="10" height="10" rx="2" class="s2"/>
<text x="314.0" y="386.0" class="t-label ink2" text-anchor="start">Wall clock, 1 task</text>
<rect x="448" y="377" width="10" height="10" rx="2" class="s3"/>
<text x="464.0" y="386.0" class="t-label ink2" text-anchor="start">Wall clock, 2 concurrent tasks</text>
</svg>
