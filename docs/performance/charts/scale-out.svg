<title id="t">A warm DTN serves in about 1-2.5 minutes</title><desc id="d">Stacked horizontal bars of warm-pool scale-out time. Before #72: 50-129 s to GCS active. With the DNS gate: 111-148 s.</desc><style>
  .surface { fill: #fcfcfb; } .ink1 { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; } .axis { stroke: #c3c2b7; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
  .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; }
  .ring { stroke: #fcfcfb; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; } .ink1 { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .ring { stroke: #1a1a19; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .t-title { font-size: 16px; font-weight: 600; } .t-sub { font-size: 12px; }
  .t-tick { font-size: 11px; font-variant-numeric: tabular-nums; } .t-label { font-size: 12px; }
  .t-value { font-size: 12px; font-weight: 600; }
</style>
<rect class="surface" x="0" y="0" width="760" height="428" rx="8"/>
<text x="24.0" y="30.0" class="t-title ink1" text-anchor="start">A warm DTN serves in about 1-2.5 minutes</text>
<text x="24.0" y="50.0" class="t-sub ink2" text-anchor="start">Seconds from SetDesiredCapacity on the warm pool. Bars: until the ASG reports InService, then until the</text>
<text x="24.0" y="66.0" class="t-sub ink2" text-anchor="start">node is active in GCS. Since #72, InService waits for endpoint DNS, so it is true readiness.</text>
