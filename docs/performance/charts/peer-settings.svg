<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-labelledby="t d">
<title id="t">The other endpoint&#x27;s settings set the speed, not AWS</title><desc id="d">Horizontal bar chart. Single tasks against a default (normal) peer run at about 1.1 Gbps with 1 or 4 DTNs; an aggressive peer 1.6; a tuned peer 4.8. Eight concurrent tasks against the normal peer reach 5.0 Gbps aggregate.</desc><style>
  .surface { fill: #fcfcfb; } .ink1 { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; } .axis { stroke: #c3c2b7; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
  .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; }
  .ring { stroke: #fcfcfb; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; } .ink1 { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .ring { stroke: #1a1a19; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .t-title { font-size: 16px; font-weight: 600; } .t-sub { font-size: 12px; }
  .t-tick { font-size: 11px; font-variant-numeric: tabular-nums; } .t-label { font-size: 12px; }
  .t-value { font-size: 12px; font-weight: 600; }
</style>
<rect class="surface" x="0" y="0" width="760" height="356" rx="8"/>
<text x="24.0" y="30.0" class="t-title ink1" text-anchor="start">The other endpoint&#x27;s settings set the speed, not AWS</text>
<text x="24.0" y="50.0" class="t-sub ink2" text-anchor="start">Throughput src -&gt; dst, 35 GB of Sentinel-2 COGs, Gbps (wall clock). Our side tuned (concurrency 32/64) in every row.</text>
<line x1="280.0" y1="86.0" x2="280.0" y2="282.0" class="grid" stroke-width="1"/>
<text x="280.0" y="300.0" class="t-tick muted" text-anchor="middle">0</text>
<line x1="348.3" y1="86.0" x2="348.3" y2="282.0" class="grid" stroke-width="1"/>
<text x="348.3" y="300.0" class="t-tick muted" text-anchor="middle">1</text>
<line x1="416.7" y1="86.0" x2="416.7" y2="282.0" class="grid" stroke-width="1"/>
<text x="416.7" y="300.0" class="t-tick muted" text-anchor="middle">2</text>
<line x1="485.0" y1="86.0" x2="485.0" y2="282.0" class="grid" stroke-width="1"/>
<text x="485.0" y="300.0" class="t-tick muted" text-anchor="middle">3</text>
<line x1="553.3" y1="86.0" x2="553.3" y2="282.0" class="grid" stroke-width="1"/>
<text x="553.3" y="300.0" class="t-tick muted" text-anchor="middle">4</text>
<line x1="621.7" y1="86.0" x2="621.7" y2="282.0" class="grid" stroke-width="1"/>
<text x="621.7" y="300.0" class="t-tick muted" text-anchor="middle">5</text>
<line x1="690.0" y1="86.0" x2="690.0" y2="282.0" class="grid" stroke-width="1"/>
<text x="690.0" y="300.0" class="t-tick muted" text-anchor="middle">6</text>
<text x="485.0" y="318.0" class="t-tick muted" text-anchor="middle">Gbps</text>
<text x="268.0" y="107.0" class="t-label ink1" text-anchor="end">Peer normal, our 1 DTN</text>
<path d="M280.0,92.0 H354.8 Q358.8,92.0 358.8,96.0 V110.0 Q358.8,114.0 354.8,114.0 H280.0 Z" class="s1"><title>Peer normal, our 1 DTN: 1.15 Gbps (negotiated concurrency 4)</title></path>
<text x="364.8" y="107.0" class="t-value ink1" text-anchor="start">1.15</text>
<text x="268.0" y="147.0" class="t-label ink1" text-anchor="end">Peer normal, our 4 DTNs</text>
<path d="M280.0,132.0 H353.4 Q357.4,132.0 357.4,136.0 V150.0 Q357.4,154.0 353.4,154.0 H280.0 Z" class="s1"><title>Peer normal, our 4 DTNs: 1.13 Gbps (negotiated concurrency 4)</title></path>
<text x="363.4" y="147.0" class="t-value ink1" text-anchor="start">1.13</text>
<text x="268.0" y="187.0" class="t-label ink1" text-anchor="end">Peer aggressive, our 4 DTNs</text>
<path d="M280.0,172.0 H384.2 Q388.2,172.0 388.2,176.0 V190.0 Q388.2,194.0 384.2,194.0 H280.0 Z" class="s1"><title>Peer aggressive, our 4 DTNs: 1.58 Gbps (negotiated concurrency 8)</title></path>
<text x="394.2" y="187.0" class="t-value ink1" text-anchor="start">1.58</text>
<text x="268.0" y="227.0" class="t-label ink1" text-anchor="end">Peer tuned (matches ours), our 4 DTNs</text>
<path d="M280.0,212.0 H602.1 Q606.1,212.0 606.1,216.0 V230.0 Q606.1,234.0 602.1,234.0 H280.0 Z" class="s1"><title>Peer tuned (matches ours), our 4 DTNs: 4.77 Gbps (negotiated concurrency 32)</title></path>
<text x="612.1" y="227.0" class="t-value ink1" text-anchor="start">4.77</text>
<text x="268.0" y="267.0" class="t-label ink1" text-anchor="end">Peer normal, our 4 DTNs, 8 concurrent tasks</text>
<path d="M280.0,252.0 H620.0 Q624.0,252.0 624.0,256.0 V270.0 Q624.0,274.0 620.0,274.0 H280.0 Z" class="s2"><title>Peer normal, our 4 DTNs, 8 concurrent tasks: 5.03 Gbps aggregate (8 tasks)</title></path>
<text x="630.0" y="267.0" class="t-value ink1" text-anchor="start">5.03</text>
<line x1="280.0" y1="86.0" x2="280.0" y2="282.0" class="axis" stroke-width="1"/>
<rect x="280" y="333" width="10" height="10" rx="2" class="s1"/>
<text x="296.0" y="342.0" class="t-label ink2" text-anchor="start">Single task</text>
<rect x="381" y="333" width="10" height="10" rx="2" class="s2"/>
<text x="397.0" y="342.0" class="t-label ink2" text-anchor="start">8 concurrent tasks (aggregate)</text>
</svg>
