<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">Latency barely matters once concurrency is high</title><desc id="d">Line chart. Tuned peer at parallelism 8: 4.8, 5.2, 4.8, 4.8 Gbps at 0, 20, 50, 80 ms. Normal peer: 1.1 at 0 ms, 1.9 at 80 ms. Tuned peer at parallelism 1 and +50 ms: 5.2.</desc><style>
  .surface { fill: #fcfcfb; } .ink1 { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; } .axis { stroke: #c3c2b7; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
  .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; }
  .ring { stroke: #fcfcfb; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; } .ink1 { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .ring { stroke: #1a1a19; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .t-title { font-size: 16px; font-weight: 600; } .t-sub { font-size: 12px; }
  .t-tick { font-size: 11px; font-variant-numeric: tabular-nums; } .t-label { font-size: 12px; }
  .t-value { font-size: 12px; font-weight: 600; }
</style>
<rect class="surface" x="0" y="0" width="760" height="380" rx="8"/>
<text x="24.0" y="30.0" class="t-title ink1" text-anchor="start">Latency barely matters once concurrency is high</text>
<text x="24.0" y="50.0" class="t-sub ink2" text-anchor="start">35 GB src -&gt; dst with added round-trip time (tc netem on dst -&gt; src traffic), Gbps wall clock.</text>
<text x="24.0" y="66.0" class="t-sub ink2" text-anchor="start">The normal peer was measured at 0 and +80 ms only; Globus raised its concurrency 4 -&gt; 8 at +80 ms.</text>
<line x1="64.0" y1="296.0" x2="590.0" y2="296.0" class="grid" stroke-width="1"/>
<text x="56.0" y="300.0" class="t-tick muted" text-anchor="end">0</text>
<line x1="64.0" y1="229.3" x2="590.0" y2="229.3" class="grid" stroke-width="1"/>
<text x="56.0" y="233.3" class="t-tick muted" text-anchor="end">2</text>
<line x1="64.0" y1="162.7" x2="590.0" y2="162.7" class="grid" stroke-width="1"/>
<text x="56.0" y="166.7" class="t-tick muted" text-anchor="end">4</text>
<line x1="64.0" y1="96.0" x2="590.0" y2="96.0" class="grid" stroke-width="1"/>
<text x="56.0" y="100.0" class="t-tick muted" text-anchor="end">6</text>
<line x1="64.0" y1="296.0" x2="590.0" y2="296.0" class="axis" stroke-width="1"/>
<text x="64.0" y="314.0" class="t-tick muted" text-anchor="middle">0 ms</text>
<text x="195.5" y="314.0" class="t-tick muted" text-anchor="middle">+20 ms</text>
<text x="392.8" y="314.0" class="t-tick muted" text-anchor="middle">+50 ms</text>
<text x="590.0" y="314.0" class="t-tick muted" text-anchor="middle">+80 ms</text>
<text x="327.0" y="334.0" class="t-tick muted" text-anchor="middle">Added round-trip time</text>
<polyline points="64.0,136.9 195.5,121.1 392.8,135.9 590.0,136.9" fill="none" class="l1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="64.0" cy="136.9" r="5" class="s1 ring" stroke-width="2"><title>Tuned peer, parallelism 8, +0 ms: 4.77 Gbps</title></circle>
<circle cx="195.5" cy="121.1" r="5" class="s1 ring" stroke-width="2"><title>Tuned peer, parallelism 8, +20 ms: 5.25 Gbps</title></circle>
<circle cx="392.8" cy="135.9" r="5" class="s1 ring" stroke-width="2"><title>Tuned peer, parallelism 8, +50 ms: 4.80 Gbps</title></circle>
<circle cx="590.0" cy="136.9" r="5" class="s1 ring" stroke-width="2"><title>Tuned peer, parallelism 8, +80 ms: 4.77 Gbps</title></circle>
<circle cx="64.0" cy="258.3" r="5" class="s2 ring" stroke-width="2"><title>Normal peer, +0 ms: 1.13 Gbps (negotiated concurrency 4)</title></circle>
<circle cx="590.0" cy="234.2" r="5" class="s2 ring" stroke-width="2"><title>Normal peer, +80 ms: 1.85 Gbps (negotiated concurrency 8)</title></circle>
<circle cx="392.8" cy="121.4" r="5" class="s3 ring" stroke-width="2"><title>Tuned peer, parallelism 1, +50 ms: 5.24 Gbps</title></circle>
<text x="600.0" y="140.9" class="t-value ink1" text-anchor="start">Tuned peer</text>
<text x="600.0" y="238.2" class="t-value ink1" text-anchor="start">Normal peer</text>
<rect x="64" y="357" width="10" height="10" rx="2" class="s1"/>
<text x="80.0" y="366.0" class="t-label ink2" text-anchor="start">Tuned peer, parallelism 8</text>
<rect x="263" y="357" width="10" height="10" rx="2" class="s2"/>
<text x="279.0" y="366.0" class="t-label ink2" text-anchor="start">Normal peer (Globus default)</text>
<rect x="483" y="357" width="10" height="10" rx="2" class="s3"/>
<text x="499.0" y="366.0" class="t-label ink2" text-anchor="start">Tuned peer, parallelism 1</text>
</svg>
