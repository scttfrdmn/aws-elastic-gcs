# Regions to deploy Elastic GCS endpoints
# Start with us-east-1 for Phase 1, expand later

# Each entry is one deployment (an independent Globus endpoint). Several may
# share a region if they have different `deployment` names (1-12 lowercase
# letters/digits; default "default"). See docs/configuration.md.

regions:
  - name: us-east-1
    deployment: default
    control_instance: t3a.large       # 2 vCPU, 8GB, x86-64 — GCS minimum (no aarch64 GCS packages)
    dtn_instance: c8in.2xlarge         # 8 vCPU, 16GB, 12.5 Gbps sustained to the internet (docs/instance-sizing.md)
    # throughput_scaleout_mbps: 1100   # default: ~70% of what one DTN of dtn_instance sustains
    warm_pool_size: 2                  # Keep 2 stopped DTNs ready
    key_pair_name: ""                  # Your EC2 key pair name

  # Uncomment for Phase 4 multi-region
  # - name: us-west-2
  #   control_instance: t3a.large
  #   dtn_instance: c8in.2xlarge
  #   warm_pool_size: 2
  #   key_pair_name: ""

  # - name: eu-west-1
  #   control_instance: t3a.large
  #   dtn_instance: c8in.2xlarge
  #   warm_pool_size: 1
  #   key_pair_name: ""

  # Two deployments in one region, e.g. a source and destination for
  # benchmarking (test/benchmark, issue #58):
  # - name: us-west-2
  #   deployment: src
  #   control_instance: t3a.large
  #   dtn_instance: c8in.2xlarge
  #   warm_pool_size: 4
  # - name: us-west-2
  #   deployment: dst
  #   control_instance: t3a.large
  #   dtn_instance: c8in.2xlarge
  #   warm_pool_size: 4

  # Endpoint network use (#56). Omit to derive from max_dtns: 32 preferred /
  # 64 max concurrency per DTN, capped at Transfer's 128; parallelism 8/16.
  # Apply to a running endpoint with: aws-elastic-gcs-ctl endpoint network-use --apply
  #   network_use:
  #     preferred_concurrency: 64
  #     max_concurrency: 128
  #     preferred_parallelism: 8
  #     max_parallelism: 16

  # Slot controller (#65), replacing the ASG and warm pool. Defaults come from
  # cost_profile (balanced | minimal); explicit settings win. See
  # docs/configuration.md.
  #   pool: slots
  #   cost_profile: balanced      # minimal: ~$0-1/month idle, cold first transfer
  #   warm_slots: 2
  #   cold_ttl: 72h
  #   drain_timeout: 10m
  #   scale_in_idle: 15m
  #   unhealthy_after: 5m
  #   max_restarts: 2
  #   instance_types: [c8in.2xlarge, m8in.2xlarge]
  #   control_node: always        # always | on_demand | none
  #   dashboard: true
